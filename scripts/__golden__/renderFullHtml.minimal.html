<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acme Co</title>
  <meta name="description" content="Test biz">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary:          'var(--primary)',
            'primary-dark':   'var(--primary-dark)',
            'primary-light':  'var(--primary-light)',
            accent:           'var(--accent)',
            surface:          'var(--surface)',
            'text-primary':   'var(--text-primary)',
            'text-secondary': 'var(--text-secondary)',
            border:           'var(--border)',
          },
          fontFamily: {
            display: ['Inter', 'system-ui', 'sans-serif'],
            sans: ['Inter', 'system-ui', 'sans-serif'],
            serif: ['Georgia', 'serif'],
            mono: ['ui-monospace', 'SFMono-Regular', 'Menlo', 'monospace'],
          },
        },
      },
    }
  </script>
  <style>
    /* Sprint 18Y — design token CSS custom properties (light mode defaults) */
    :root {
      --primary:        #4f46e5;
      --primary-dark:   #4338ca;
      --primary-light:  #818cf8;
      --accent:         #f59e0b;
      --accent-color:   #f59e0b;
      --background:     #ffffff;
      --surface:        #f8fafc;
      --text-primary:   #1e293b;
      --text-secondary: #475569;
      --border:         #e2e8f0;
    }
    /* Sprint 18Y — dark mode overrides (.dark class on <html>, toggled by TweaksPanel) */
    :root.dark {
      color-scheme: dark;
      --primary:        #5d55e7;
      --accent:         #f6ae31;
      --accent-color:   #f6ae31;
      --background:     #0f172a;
      --surface:        #1e293b;
      --text-primary:   #f1f5f9;
      --text-secondary: #94a3b8;
      --border:         #334155;
    }
    body { font-family: 'Inter', system-ui, sans-serif; background: var(--background); color: var(--text-primary); }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    .skip-link:focus { position: fixed; top: 1rem; left: 1rem; background: var(--primary); color: white; padding: 0.75rem 1rem; z-index: 100; clip: auto; width: auto; height: auto; border-radius: 4px; }
    a:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; border-radius: 2px; }
    .mobile-menu { display: none; }
    .mobile-menu.open { display: block; }

    /* Sprint 18N — scroll animation presets */

[data-anim] {
  opacity: 0;
  transition:
    opacity 700ms ease-out,
    transform 700ms cubic-bezier(0.16, 1, 0.3, 1);
  will-change: opacity, transform;
}
[data-anim].is-visible {
  opacity: 1;
  transform: none;
}

[data-anim~="slide-up"] { transform: translateY(20px); }
[data-anim~="slide-from-left"] { transform: translateX(-30px); }
[data-anim~="slide-from-right"] { transform: translateX(30px); }
[data-anim~="scale-in"] { transform: scale(0.95); }
/* fade-in has no transform — base opacity transition handles it */

/* stagger-children — direct child delays */
[data-anim~="stagger-children"].is-visible > [data-anim]:nth-child(1) { transition-delay: 0ms; }
[data-anim~="stagger-children"].is-visible > [data-anim]:nth-child(2) { transition-delay: 100ms; }
[data-anim~="stagger-children"].is-visible > [data-anim]:nth-child(3) { transition-delay: 200ms; }
[data-anim~="stagger-children"].is-visible > [data-anim]:nth-child(4) { transition-delay: 300ms; }
[data-anim~="stagger-children"].is-visible > [data-anim]:nth-child(5) { transition-delay: 400ms; }
[data-anim~="stagger-children"].is-visible > [data-anim]:nth-child(6) { transition-delay: 500ms; }
[data-anim~="stagger-children"].is-visible > [data-anim]:nth-child(n+7) { transition-delay: 600ms; }

/* parallax-bg — JS-driven scroll. Desktop only — mobile scroll listeners are jittery */
[data-anim~="parallax-bg"] {
  background-attachment: fixed;
  background-size: cover;
  background-position: center;
}
@media (max-width: 768px) {
  [data-anim~="parallax-bg"] {
    background-attachment: scroll;
  }
}

/* sticky-scroll-reveal */
[data-anim~="sticky-scroll-reveal"] {
  position: sticky;
  top: 4rem;
}

/* count-up — text is replaced by JS, but show dimmed pre-fire so layout doesn't shift */
[data-anim~="count-up"]:not(.is-visible) {
  opacity: 0.5;
}

/* text-reveal — word spans inserted by JS */
[data-anim~="text-reveal"] .anim-word {
  display: inline-block;
  opacity: 0;
  transform: translateY(8px);
  transition:
    opacity 400ms ease-out,
    transform 400ms cubic-bezier(0.16, 1, 0.3, 1);
}
[data-anim~="text-reveal"].is-visible .anim-word {
  opacity: 1;
  transform: none;
}

@media (prefers-reduced-motion: reduce) {
  [data-anim],
  [data-anim].is-visible,
  [data-anim] *,
  [data-anim].is-visible * {
    transition: none !important;
    animation: none !important;
    transform: none !important;
    opacity: 1 !important;
  }
}
  </style>
</head>
<body>
  <a href="#main" class="skip-link sr-only">Skip to main content</a>
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-sm border-b border-border" role="banner">
    <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between" aria-label="Main navigation">
      <a href="#" class="font-display font-bold text-xl text-primary">Acme Co</a>
      <div class="hidden md:flex items-center gap-8">
        <a href="#hero" class="text-sm font-medium text-text-primary hover:text-primary transition-colors">Hero</a>
        <a href="#about" class="text-sm font-medium text-text-primary hover:text-primary transition-colors">About</a>
      </div>
      <button class="md:hidden p-2 text-text-primary" aria-label="Toggle navigation menu" aria-expanded="false" aria-controls="mobile-menu" onclick="const m=document.getElementById('mobile-menu');m.classList.toggle('open');this.setAttribute('aria-expanded', this.getAttribute('aria-expanded')==='true'?'false':'true');">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </nav>
    <div id="mobile-menu" class="mobile-menu md:hidden border-t border-border bg-white">
      <div class="max-w-7xl mx-auto px-6 py-4 flex flex-col gap-3">
        <a href="#hero" class="text-sm font-medium text-text-primary hover:text-primary transition-colors">Hero</a>
        <a href="#about" class="text-sm font-medium text-text-primary hover:text-primary transition-colors">About</a>
      </div>
    </div>
  </header>
  <main id="main" role="main">
  <section data-nexus-id="hero" id="hero"><h1>Welcome to Acme</h1></section>

  <section data-nexus-id="about" id="about"><p>About us content</p></section>
  </main>
  <footer class="bg-primary text-white py-12 mt-16" role="contentinfo">
    <div class="max-w-7xl mx-auto px-6">
      <div class="border-t border-white/10 pt-6 flex flex-col md:flex-row justify-between items-center gap-4">
        <p class="text-sm opacity-80">© YEAR Acme Co. All rights reserved.</p>
        <p class="text-xs opacity-60 font-mono">Built with Leadership Legacy Digital</p>
      </div>
    </div>
  </footer>
  <script>
(function() {
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
    document.querySelectorAll('[data-anim]').forEach(function (el) { el.classList.add('is-visible'); });
    return;
  }

  /* text-reveal: split into per-word spans with cascading delays */
  document.querySelectorAll('[data-anim~="text-reveal"]').forEach(function (el) {
    if (el.dataset.animWordsSplit === '1') return;
    var text = el.textContent || '';
    var parts = text.split(/(\s+)/);
    el.textContent = '';
    var wordIndex = 0;
    parts.forEach(function (part) {
      if (/^\s+$/.test(part)) {
        el.appendChild(document.createTextNode(part));
      } else if (part.length > 0) {
        var span = document.createElement('span');
        span.className = 'anim-word';
        span.style.transitionDelay = (wordIndex * 40) + 'ms';
        span.textContent = part;
        el.appendChild(span);
        wordIndex++;
      }
    });
    el.dataset.animWordsSplit = '1';
  });

  /* count-up: parse target, reset to 0 for stable layout */
  document.querySelectorAll('[data-anim~="count-up"]').forEach(function (el) {
    var raw = (el.textContent || '').trim();
    var prefixMatch = raw.match(/^[^0-9.\-]+/);
    var numMatch = raw.match(/[0-9][0-9,.]*/);
    var suffixMatch = raw.replace(/^[^0-9.\-]*/, '').replace(/^[0-9.,\-]+/, '');
    if (numMatch) {
      var clean = numMatch[0].replace(/,/g, '');
      var num = parseFloat(clean);
      if (!isNaN(num)) {
        el.dataset.animCountTarget = String(num);
        el.dataset.animCountPrefix = prefixMatch ? prefixMatch[0] : '';
        el.dataset.animCountSuffix = suffixMatch || '';
        el.dataset.animCountIsInt = String(num % 1 === 0);
        el.textContent = (el.dataset.animCountPrefix || '') + '0' + (el.dataset.animCountSuffix || '');
      }
    }
  });

  function runCountUp(el) {
    var target = parseFloat(el.dataset.animCountTarget || '0');
    var prefix = el.dataset.animCountPrefix || '';
    var suffix = el.dataset.animCountSuffix || '';
    var isInt = el.dataset.animCountIsInt === 'true';
    var start = performance.now();
    var duration = 1200;
    function tick(now) {
      var t = Math.min(1, (now - start) / duration);
      var eased = 1 - Math.pow(1 - t, 3);
      var v = target * eased;
      var rendered = isInt ? Math.round(v).toLocaleString() : v.toFixed(1);
      el.textContent = prefix + rendered + suffix;
      if (t < 1) requestAnimationFrame(tick);
      else el.textContent = prefix + (isInt ? target.toLocaleString() : target.toFixed(1)) + suffix;
    }
    requestAnimationFrame(tick);
  }

  var observer = new IntersectionObserver(function (entries) {
    entries.forEach(function (entry) {
      if (entry.isIntersecting && entry.intersectionRatio >= 0.1) {
        entry.target.classList.add('is-visible');
        if (entry.target.matches('[data-anim~="count-up"]') && entry.target.dataset.animCountTarget) {
          runCountUp(entry.target);
        }
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: [0.1, 0.25], rootMargin: '0px 0px -50px 0px' });

  document.querySelectorAll('[data-anim]').forEach(function (el) { observer.observe(el); });

  /* parallax-bg scroll handler */
  var parallaxEls = document.querySelectorAll('[data-anim~="parallax-bg"]');
  if (parallaxEls.length > 0 && window.innerWidth > 768) {
    var ticking = false;
    function updateParallax() {
      parallaxEls.forEach(function (el) {
        var rect = el.getBoundingClientRect();
        var offset = rect.top * -0.5;
        el.style.backgroundPositionY = 'calc(50% + ' + offset + 'px)';
      });
      ticking = false;
    }
    window.addEventListener('scroll', function () {
      if (!ticking) {
        window.requestAnimationFrame(updateParallax);
        ticking = true;
      }
    }, { passive: true });
    updateParallax();
  }
})();
  </script>
  
</body>
</html>
