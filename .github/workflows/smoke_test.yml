name: NEXUS Smoke Test Runner

on:
  workflow_dispatch:
    inputs:
      provider:
        description: 'Provider — openrouter_and_openai for standard sweeps, all for premium (needs Anthropic).'
        required: true
        type: choice
        options:
          - openrouter_and_openai
          - all
          - openrouter
          - openai
          - anthropic
        default: openrouter_and_openai
      tier:
        description: 'Routing tier — standard (cost-optimised) or premium (quality-dominant)'
        required: true
        type: choice
        options:
          - standard
          - premium
        default: standard
      agent:
        description: 'Agent to test (leave blank for all active slots)'
        required: false
        type: choice
        options:
          - ''
          - NEXUS
          - FORGE
          - HERALD
          - INTAKE
          - SENTINEL
          - ATLAS
          - SCOUT
          - ORACLE
          - ANCHOR
          - BUILDER
          - META_COGNITION
        default: ''
      task_type:
        description: 'Task type (leave blank for all)'
        required: false
        default: ''

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 110

    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJson(inputs.provider == 'all' && '["anthropic","openrouter","openai"]' || inputs.provider == 'openrouter_and_openai' && '["openrouter","openai"]' || format('["{0}"]', inputs.provider)) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: |
          cd scripts
          pip install -r requirements.txt
          pip install boto3

      - name: Write .env from secrets
        run: |
          cat > scripts/.env << 'ENVEOF'
          CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID=${{ secrets.CF_D1_DATABASE_ID }}
          CF_R2_BUCKET=${{ secrets.CF_R2_BUCKET }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          VPS_TUNNEL_URL=
          VPS_TUNNEL_SECRET=
          DRY_RUN=false
          ENVEOF

      - name: Run smoke tests — ${{ matrix.provider }} [${{ inputs.tier }}]
        working-directory: scripts
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
          DRY_RUN: false
        run: |
          ARGS="--provider ${{ matrix.provider }} --tier ${{ inputs.tier }}"
          if [ -n "${{ inputs.agent }}" ]; then
            ARGS="$ARGS --agent ${{ inputs.agent }}"
          fi
          if [ -n "${{ inputs.task_type }}" ]; then
            ARGS="$ARGS --task-type ${{ inputs.task_type }}"
          fi
          echo "Running: python -m nexus_ops.smoke_test_runner $ARGS"
          python -m nexus_ops.smoke_test_runner $ARGS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-${{ matrix.provider }}-${{ inputs.tier }}-${{ github.run_id }}
          path: scripts/logs/
          retention-days: 14
