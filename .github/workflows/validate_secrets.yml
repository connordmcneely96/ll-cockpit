name: NEXUS Secret Validation

on:
  workflow_dispatch:

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install minimal dependencies
        run: |
          cd scripts
          pip install python-dotenv httpx anthropic boto3

      - name: Write .env file from secrets
        run: |
          cat > scripts/.env << EOF
          CF_ACCOUNT_ID=${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN=${{ secrets.CF_API_TOKEN }}
          CF_D1_DATABASE_ID=${{ secrets.CF_D1_DATABASE_ID }}
          CF_R2_BUCKET=${{ secrets.CF_R2_BUCKET }}
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENROUTER_API_KEY=${{ secrets.OPENROUTER_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          R2_ACCESS_KEY_ID=${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY=${{ secrets.R2_SECRET_ACCESS_KEY }}
          VPS_TUNNEL_URL=
          VPS_TUNNEL_SECRET=
          DRY_RUN=true
          EOF

      - name: Validate all secrets load correctly
        working-directory: scripts
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python3 << 'PYEOF'
          import os
          from pathlib import Path
          from dotenv import load_dotenv

          load_dotenv(Path('.env'), override=True)

          required = [
              'CF_ACCOUNT_ID', 'CF_API_TOKEN', 'CF_D1_DATABASE_ID', 'CF_R2_BUCKET',
              'SUPABASE_URL', 'SUPABASE_SERVICE_ROLE_KEY', 'ANTHROPIC_API_KEY',
              'OPENROUTER_API_KEY', 'OPENAI_API_KEY', 'R2_ACCESS_KEY_ID', 'R2_SECRET_ACCESS_KEY'
          ]

          all_ok = True
          for key in required:
              val = os.getenv(key, '')
              if val and val != key:
                  print(f"  OK  {key}: {val[:8]}...({len(val)} chars)")
              else:
                  print(f"  MISSING  {key}: NOT SET or empty")
                  all_ok = False

          print()
          if all_ok:
              print("ALL 11 SECRETS LOADED CORRECTLY")
          else:
              print("SOME SECRETS ARE MISSING — check GitHub Settings > Secrets")
              exit(1)
          PYEOF

      - name: Test D1 connectivity
        working-directory: scripts
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python3 << 'PYEOF'
          from dotenv import load_dotenv
          from pathlib import Path
          load_dotenv(Path('.env'), override=True)
          from nexus_ops.config import Config, D1Client
          cfg = Config()
          with D1Client(cfg) as d1:
              rows = d1.query_rows("SELECT COUNT(*) as n FROM model_registry WHERE active=1")
              n = rows[0]['n']
              print(f"D1 OK — {n} active models in registry")
              assert n > 0, "No models found"
          PYEOF

      - name: Test Anthropic API connectivity
        working-directory: scripts
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python3 << 'PYEOF'
          from dotenv import load_dotenv
          from pathlib import Path
          load_dotenv(Path('.env'), override=True)
          from nexus_ops.config import Config, AnthropicClient
          cfg = Config()
          claude = AnthropicClient(cfg)
          data = claude.complete(model='claude-haiku-4-5-20251001', prompt='Say OK', max_tokens=5)
          output = data['content'][0]['text']
          tokens = data['usage']['input_tokens']
          print(f"Anthropic API OK — response: '{output}' ({tokens} input tokens)")
          claude.close()
          PYEOF

      - name: Test OpenRouter API connectivity
        working-directory: scripts
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python3 << 'PYEOF'
          import os, httpx
          from dotenv import load_dotenv
          from pathlib import Path
          load_dotenv(Path('.env'), override=True)
          key = os.getenv('OPENROUTER_API_KEY', '')
          resp = httpx.post(
              'https://openrouter.ai/api/v1/chat/completions',
              headers={'Authorization': f'Bearer {key}', 'Content-Type': 'application/json'},
              json={'model': 'google/gemini-2.0-flash-001', 'messages': [{'role': 'user', 'content': 'Say OK'}], 'max_tokens': 5},
              timeout=30
          )
          if resp.status_code == 200:
              output = resp.json()['choices'][0]['message']['content']
              print(f"OpenRouter API OK — response: '{output}'")
          else:
              print(f"OpenRouter API ERROR: {resp.status_code} {resp.text[:200]}")
              exit(1)
          PYEOF

      - name: Test R2 connectivity
        working-directory: scripts
        env:
          PYTHONPATH: ${{ github.workspace }}/scripts
        run: |
          python3 << 'PYEOF'
          from dotenv import load_dotenv
          from pathlib import Path
          load_dotenv(Path('.env'), override=True)
          from nexus_ops.config import Config, R2Client
          cfg = Config()
          r2 = R2Client(cfg)
          result = r2.upload_json('test/gha_connection_check.json', {'status': 'ok', 'source': 'github-actions'})
          print(f"R2 OK — uploaded to: {result}")
          PYEOF
