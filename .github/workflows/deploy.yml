# GitHub Actions — Cloudflare deploy on push to main, build verification on PRs
#
# Push to main: writes NEXT_PUBLIC_* env vars to .env.production (Next.js auto-loads
# this at build time), applies any pending D1 migrations, then deploys the worker
# via `npm run deploy`.
#
# Pull request to main: runs the OpenNext build only (no deploy, no D1 migrations,
# no lockfile commit-back). Surfaces build failures before merge instead of after.
#
# Required GitHub repo secrets:
#   - CLOUDFLARE_API_TOKEN            (Workers Scripts + KV + R2 + AI + Queues + Vectorize + D1 Edit + Account Settings:Read)
#   - CLOUDFLARE_ACCOUNT_ID
#   - NEXT_PUBLIC_SUPABASE_URL        (bundled into the build, used by createClient)
#   - NEXT_PUBLIC_SUPABASE_ANON_KEY   (bundled into the build, used by createClient)
#
# ANTHROPIC_API_KEY stays as a runtime worker secret (wrangler secret put).

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'deploy-main' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (with lockfile fallback)
        run: |
          echo "Trying npm ci (strict lockfile)..."
          if npm ci --no-audit --no-fund; then
            echo "✓ npm ci succeeded"
          else
            echo "⚠ npm ci failed — lockfile out of sync. Falling back to npm install..."
            npm install --no-audit --no-fund
            echo "✓ npm install completed (lockfile regenerated)"
            echo "LOCKFILE_REGENERATED=true" >> $GITHUB_ENV
          fi

      - name: Commit regenerated lockfile
        if: github.event_name == 'push' && env.LOCKFILE_REGENERATED == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "No lockfile changes to commit"
          else
            git commit -m "chore: regenerate package-lock.json [skip ci]"
            git push
            echo "✓ Lockfile committed back to main"
          fi

      # Required gate: if the tests fail, the job fails here and NEITHER the D1
      # migrations NOR the deploy below run. Runs on push and PR alike.
      - name: Run tests (required — blocks deploy on failure)
        run: npm test

      - name: Write build-time env vars
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" >> .env.production
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env.production
          echo "✓ Wrote .env.production with $(wc -l < .env.production) vars"
          # Sanity check that secrets weren't empty (don't print values)
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_URL secret is empty"
            exit 1
          fi
          if [ -z "${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "::error::NEXT_PUBLIC_SUPABASE_ANON_KEY secret is empty"
            exit 1
          fi

      - name: Apply D1 migrations (remote)
        if: github.event_name != 'pull_request'
        run: npx wrangler d1 migrations apply ll-cockpit-db --remote
        continue-on-error: false

      - name: Build (PR verification — no deploy)
        if: github.event_name == 'pull_request'
        run: npx --no @opennextjs/cloudflare build

      - name: Build + Deploy to Cloudflare Workers
        if: github.event_name != 'pull_request'
        run: npm run deploy

      - name: Deploy summary
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "### PR Build Verification summary" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Deploy summary" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Event: \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Actor: @${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- Branch: \`${{ github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "- Worker URL: https://ll-cockpit.connorpattern.workers.dev" >> $GITHUB_STEP_SUMMARY
          fi
          if [ "${LOCKFILE_REGENERATED}" = "true" ]; then
            echo "- ⚠ Lockfile was out of sync and has been regenerated" >> $GITHUB_STEP_SUMMARY
          fi
