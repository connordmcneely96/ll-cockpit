openapi: 3.1.0
info:
  title: NEXUS Knowledge Search
  description: Search the NEXUS knowledge base for architecture decisions, failure patterns, technology references, and sprint build history.
  version: 1.0.0

servers:
  - url: https://lewmvmyettxryetzrxmv.supabase.co/functions/v1
    description: Supabase Edge Functions

paths:
  /knowledge-search:
    post:
      operationId: searchKnowledge
      summary: Semantic search over NEXUS knowledge base
      description: Embeds query via Cloudflare Workers AI and runs cosine similarity search over study_nodes and sprint_items in Supabase pgvector.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - query
              properties:
                query:
                  type: string
                  description: Natural language search query
                  example: How do we deploy standalone Cloudflare Workers?
                limit:
                  type: integer
                  description: Number of results to return (default 5, max 10)
                  default: 5
                  minimum: 1
                  maximum: 10
                tenant_id:
                  type: string
                  description: Tenant scope — always use "default"
                  default: default
                category:
                  type: string
                  description: Optional category filter
                  enum:
                    - failure_pattern
                    - architecture
                    - technology
                    - process
                    - codebase
      responses:
        "200":
          description: Successful search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        title:
                          type: string
                        category:
                          type: string
                        content:
                          type: string
                        tags:
                          type: string
                        source:
                          type: string
                        tenant_id:
                          type: string
                        table_name:
                          type: string
                        score:
                          type: number
                  count:
                    type: integer
        "400":
          description: Missing or invalid query
        "500":
          description: Embedding or search error
