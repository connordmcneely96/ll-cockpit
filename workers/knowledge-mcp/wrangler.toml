name = "knowledge-mcp"
main = "src/index.ts"
compatibility_date = "2025-03-10"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "ll-cockpit-db"
database_id = "831eeccf-60bc-4378-8a3b-71dfb910756e"

[ai]
binding = "AI"

[[vectorize]]
binding = "KNOWLEDGE_VECTORIZE"
index_name = "nexus-knowledge"

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "1ac0b09075f04bcd9b83d0976e12b2b2"

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "KnowledgeMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["KnowledgeMCP"]

[vars]
ENVIRONMENT = "production"
