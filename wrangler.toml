name = "ll-cockpit"
main = ".open-next/worker.js"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
assets = { directory = ".open-next/assets", binding = "ASSETS" }

[[d1_databases]]
binding = "DB"
database_name = "ll-cockpit-db"
database_id = "831eeccf-60bc-4378-8a3b-71dfb910756e"

[[kv_namespaces]]
binding = "KV"
id = "db6866496e1f426e9d84758c9329ccfe"

[[r2_buckets]]
binding = "R2"
bucket_name = "ll-cockpit-r2"

[[queues.producers]]
queue = "knowledge-embed-queue"
binding = "KNOWLEDGE_QUEUE"

[ai]
binding = "AI"

[[vectorize]]
binding = "KNOWLEDGE_VECTORIZE"
index_name = "nexus-knowledge"

[[vectorize]]
binding = "ORACLE_VECTORIZE"
index_name = "oracle-research"

[[vectorize]]
binding = "ATLAS_RAG"
index_name = "atlas-engineering"

# ORACLE runs at 7am CST (1pm UTC) every day
# Also runs hourly fetch-only to keep queue fresh
[triggers]
crons = [
  "0 13 * * *",   # 7am CST — full pipeline (fetch + summarize + vectorize + digest)
  "0 * * * *",    # every hour — fetch only (keeps queue populated)
  "*/15 * * * *", # every 15 min — agent heartbeat (reaper + drain + stall check)
]
